name: Release APK

on:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/release-apk.yml"
    tags:
      - "v*"
      - "sideload"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - name: Build sideload APK with no API keys
        working-directory: android
        env:
          ARETE_PUBLIC_BUILD: "1"
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name APK
        working-directory: android
        run: |
          set -euo pipefail
          mkdir -p dist
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="sideload"
          fi
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Arete-${VERSION}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Arete.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Arete-apk
          path: android/dist/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'sideload' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'Sideload APK' }}
          prerelease: false
          make_latest: true
          generate_release_notes: ${{ github.ref_type == 'tag' }}
          files: android/dist/*.apk
          body: |
            Sideload APK (debug-signed). Allow install from unknown sources.

            This build does **not** include NPS or Recreation.gov API keys.
            Maps, GPS, import, and USGS/NWS still work. Rec Info stays empty
            unless you build locally with your own keys in `local.properties`.

            Built from `${{ github.sha }}` on `${{ github.ref_name }}`.
